version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "400017207288"
    AWS_DEFAULT_REGION: "us-east-1"

phases:
  pre_build:
    commands:
      - echo "AWS_ACCOUNT_ID=400017207288"
      - echo "AWS_DEFAULT_REGION=us-east-1"
      - aws ecr describe-repositories --repository-names penguinshop-dev || echo "ECR repo not found"
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 400017207288.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - docker images
      - echo Building the Docker image...
      - docker build -t penguinshop-dev ./app
      - docker tag penguinshop-dev:latest 400017207288.dkr.ecr.us-east-1.amazonaws.com/penguinshop-dev:latest
      - docker images
  post_build:
    commands:
      - echo Pushing the Docker image...
      - echo pipeline version 33...
      - docker push 400017207288.dkr.ecr.us-east-1.amazonaws.com/penguinshop-dev:latest
      - echo Build completed on `date`\- echo Writing imagedefinitions.json...
      - printf '[{"name":"PenguinshopServicedevContainer","imageUri":"400017207288.dkr.ecr.us-east-1.amazonaws.com/penguinshop-dev:latest"}]' > imagedefinitions.json
artifacts:
  files: '**/*'

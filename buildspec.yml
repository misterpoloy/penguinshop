version: 0.2

phases:
  pre_build:
    commands:
      - set -euo pipefail
      - : "${ACCOUNT?Need ACCOUNT env var from CodeBuildAction}"
      - : "${AWS_DEFAULT_REGION?Need AWS_DEFAULT_REGION env var from CodeBuildAction}"
      - : "${REPO?Need REPO env var from CodeBuildAction}"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - ECR_URI="${ACCOUNT}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - echo "Logging in to Amazon ECR at ${ECR_URI}..."
      - aws --version
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${ECR_URI}"
      - echo "Checking ECR repo ${REPO} (informational; repo should exist already)"
      - aws ecr describe-repositories --repository-names "${REPO}" >/dev/null 2>&1 || echo "WARN: ECR repo ${REPO} not found (ensure it exists)"

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building image ${REPO}:${IMAGE_TAG}..."
      - docker build -t "${REPO}:${IMAGE_TAG}" ./app
      - docker tag "${REPO}:${IMAGE_TAG}" "${ECR_URI}/${REPO}:${IMAGE_TAG}"
      - docker images

  post_build:
    commands:
      - echo "Pushing ${ECR_URI}/${REPO}:${IMAGE_TAG}..."
      - docker push "${ECR_URI}/${REPO}:${IMAGE_TAG}"
      - echo "Writing imagedefinitions.json for ECS (container name: web)"
      - printf '[{"name":"web","imageUri":"%s/%s:%s"}]' "${ECR_URI}" "${REPO}" "${IMAGE_TAG}" > imagedefinitions.json
      - echo "Build completed on $(date)"

artifacts:
  files:
    - imagedefinitions.json
